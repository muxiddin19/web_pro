<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Profile Card</title>
<style>
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --fg: #1f2933; --muted: #5f6b7a; --border: #d9dee5;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14181d; --surface: #1d232b; --fg: #e8edf2; --muted: #9aa6b4; --border: #2d3641;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14181d; --surface: #1d232b; --fg: #e8edf2; --muted: #9aa6b4; --border: #2d3641;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #root { max-width: 24rem; margin: 0 auto; padding: 2rem 1.25rem; }
  .profile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; }
  .profile h2 { margin: 0 0 0.25rem; font-size: 1.25rem; }
  .profile p { margin: 0.25rem 0; color: var(--muted); }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
  const e = React.createElement;

  // Child receives and uses them
  function ProfileCard({ name, role, followers, isVerified }) {
    return e("div", { className: "profile" },
      e("h2", null, name, " ", isVerified && "[Verified]"),
      e("p", null, role),
      e("p", null, followers.toLocaleString(), " followers")
    );
  }

  // Parent passes props
  function App() {
    return e(ProfileCard, {
      name: "Kim Minho",
      role: "Frontend Developer",
      followers: 1240,
      isVerified: true
    });
  }

  ReactDOM.createRoot(document.getElementById("root")).render(e(App));
</script>
</body>
</html>
