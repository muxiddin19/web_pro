<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Grade Card App</title>

  <style>
    body {
      font-family: "Noto Sans KR", "Malgun Gothic", sans-serif;
      background: #f3f5f8;
      margin: 0;
      padding: 32px 16px;
      color: #1f2933;
    }
    main {
      max-width: 420px;
      margin: 0 auto;
    }
    h1 {
      margin: 0 0 20px;
    }
    .grade-card {
      background: #fff;
      border: 1px solid #d9dee5;
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 14px;
    }
    .grade-card h3 {
      margin: 0 0 8px;
    }
    .grade-card p {
      margin: 4px 0;
    }
    .pass { color: #1a7f45; font-weight: 700; }
    .fail { color: #c0392b; font-weight: 700; }
  </style>

  <!-- React, ReactDOM, and Babel (translates JSX in the browser) -->
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.development.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
</head>
<body>
  <!-- React draws the app inside this element -->
  <div id="root"></div>

  <!-- type="text/babel" makes Babel convert the JSX below into plain JavaScript -->
  <script type="text/babel">
    function GradeCard({ student }) {
      const passed = student.score >= 60;
      return (
        <div className="grade-card">
          <h3>{student.name}</h3>
          <p>학번: {student.id}</p>
          <p>점수: {student.score}점</p>
          <span className={passed ? 'pass' : 'fail'}>
            {passed ? '✅ 합격' : '❌ 불합격'}
          </span>
        </div>
      );
    }

    const roster = [
      { id: '20231001', name: '김민준', score: 88 },
      { id: '20231002', name: '이서연', score: 45 },
    ];

    function GradeBoard() {
      return (
        <main>
          <h1>성적 현황</h1>
          {roster.map(s => <GradeCard key={s.id} student={s} />)}
        </main>
      );
    }

    // This line was missing: it actually mounts the app into #root
    ReactDOM.createRoot(document.getElementById('root')).render(<GradeBoard />);
  </script>
</body>
</html>
