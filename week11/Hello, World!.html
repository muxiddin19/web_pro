<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hello, World!</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1f2933;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #14181d; --fg: #e8edf2; }
  }
  :root[data-theme="dark"] { --bg: #14181d; --fg: #e8edf2; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: Georgia, "Times New Roman", serif; }
  #root { max-width: 40rem; margin: 0 auto; padding: 2rem 1.25rem; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
  const e = React.createElement;

  // Simplest possible React component
  function Greeting() {
    return e("h1", null, "Hello, World!");
  }

  // Using it in another component
  function App() {
    return e("div", null, e(Greeting), e(Greeting), e(Greeting));
  }

  ReactDOM.createRoot(document.getElementById("root")).render(e(App));
</script>
</body>
</html>
